<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFW Financial Wellness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a working tool. One calm column of cards under a sticky tab bar; numbers lead, prose follows. */
:root {
  --bg: #F3F5F7; --surface: #FFFFFF; --sunk: #E9EDF1; --ink: #13202B; --muted: #4C5B68; --line: #D5DCE3;
  --accent: #0A5C72; --accent-ink: #FFFFFF; --accent-soft: #DCEEF2; --mark: #8A5200; --mark-soft: #FFF1D9;
  --good: #176B3C; --good-soft: #E2F3E8; --crit: #A8261E; --crit-soft: #FBE7E5;
  --s1: #2A78D6; --s2: #EB6834; --s3: #1BAF7A; --s4: #6250D6; --s5: #7A8894;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1418; --surface: #162028; --sunk: #1E2A34; --ink: #E7EEF2; --muted: #A3B3BF; --line: #2C3A46;
    --accent: #62C3D8; --accent-ink: #06222A; --accent-soft: #143642; --mark: #F0B45A; --mark-soft: #3A2B10;
    --good: #6FD39A; --good-soft: #143424; --crit: #FF9A90; --crit-soft: #3F1B18;
    --s1: #5B9BE6; --s2: #F08A5F; --s3: #3FCB96; --s4: #9486F0; --s5: #8D9BA7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1418; --surface: #162028; --sunk: #1E2A34; --ink: #E7EEF2; --muted: #A3B3BF; --line: #2C3A46;
  --accent: #62C3D8; --accent-ink: #06222A; --accent-soft: #143642; --mark: #F0B45A; --mark-soft: #3A2B10;
  --good: #6FD39A; --good-soft: #143424; --crit: #FF9A90; --crit-soft: #3F1B18;
  --s1: #5B9BE6; --s2: #F08A5F; --s3: #3FCB96; --s4: #9486F0; --s5: #8D9BA7;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; font-family: var(--body); }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); }
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.02em; }
.brand span { color: var(--muted); font-size: 0.85rem; }
nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
nav a { padding: 9px 12px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.92rem; white-space: nowrap;
  border-bottom: 3px solid transparent; }
nav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
nav a:hover { color: var(--ink); }
main { max-width: 1120px; margin: 0 auto; padding: 22px 16px 60px; display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.split { display: grid; gap: 18px; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
.lead { font-size: 1.05rem; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--mark-soft); color: var(--mark); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.tile b { font-family: var(--display); font-size: 1.7rem; font-variant-numeric: tabular-nums; line-height: 1.1; display: block; }
.tile span { color: var(--muted); font-size: 0.86rem; }
button, .btn { font: inherit; font-weight: 600; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 9px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .btn:hover { border-color: var(--accent); }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
select, input[type="number"], input[type="text"], input[type="password"], textarea { font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; font-weight: 600; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
legend { font-weight: 600; padding: 0; margin-bottom: 6px; max-width: 68ch; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opts.h { flex-direction: row; flex-wrap: wrap; }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--surface); padding: 7px 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.plan-text { background: var(--sunk); border-radius: 10px; padding: 16px 18px; font-size: 1.04rem; line-height: 1.7; }
.note { background: var(--mark-soft); color: var(--mark); border-radius: 8px; padding: 10px 14px; }
.note.crit { background: var(--crit-soft); color: var(--crit); }
.note.good { background: var(--good-soft); color: var(--good); }
.note.info { background: var(--accent-soft); color: var(--ink); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 0.82rem; }
td.n, th.n { text-align: right; }
tr.hl td { background: var(--accent-soft); font-weight: 600; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { font-family: var(--body); fill: var(--muted); font-size: 12px; }
svg.chart text.v { fill: var(--ink); font-weight: 600; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .axis { stroke: var(--muted); stroke-width: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.84rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.bar { height: 10px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.steps span { padding: 3px 9px; border-radius: 999px; background: var(--sunk); }
.steps span.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.steps span.done { background: var(--good-soft); color: var(--good); }
details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
summary { cursor: pointer; font-weight: 600; }
.sim { border: 2px dashed var(--crit); }
.simflag { color: var(--crit); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.04em; }
code { background: var(--sunk); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }
.err { color: var(--crit); font-weight: 600; }
footer { max-width: 1120px; margin: 0 auto; padding: 0 16px 40px; color: var(--muted); font-size: 0.82rem; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .3s; } }
</style>
</head>

<script>/* PFW engine: a line-for-line JavaScript port of pfw_core.py and the scoring in
   pfw_instruments.py. No DOM access. Parity with Python is checked by web/test_parity.py. */
function createEngine(DATA) {
  const K = DATA.core, INS = DATA.instruments;
  const RUPEE = "₹";

  // ---- numeric helpers that match Python --------------------------------
  function pyRound(x, nd) {                       // round half to even, like Python 3
    const m = Math.pow(10, nd || 0), y = x * m, f = Math.floor(y), d = y - f;
    let r;
    if (Math.abs(d - 0.5) < 1e-12) r = (f % 2 === 0) ? f : f + 1;
    else r = Math.round(y);
    return r / m;
  }
  function fx(x, nd) {                            // Python's f"{x:.ndf}": exact ties go to the even digit
    const long = Math.abs(x).toFixed(Math.min(100, nd + 30)), cut = long.length - 30;
    if (/^50*$/.test(long.slice(cut))) {
      const digits = long.slice(0, cut).replace(".", "");
      if (Number(digits[digits.length - 1]) % 2 === 0) {
        const kept = long.slice(0, cut).replace(/\.$/, "");
        return (x < 0 && Number(kept) !== 0 ? "-" : "") + kept;
      }
    }
    return x.toFixed(nd);
  }
  function inr(x) {
    x = pyRound(x);
    let s = String(Math.abs(x));
    if (s.length > 3) {
      const head = s.slice(0, -3).replace(/(\d)(?=(\d\d)+$)/g, "$1,");
      s = head + "," + s.slice(-3);
    }
    return (x < 0 ? "-" : "") + RUPEE + s;
  }
  function inrWords(x) {
    if (x >= 1e7) return RUPEE + fx(x / 1e7, 1) + " crore";
    if (x >= 1e5) return RUPEE + fx(x / 1e5, 1) + " lakh";
    if (x >= 1e3) return RUPEE + fx(pyRound(x / 1e3), 0) + " thousand";
    return RUPEE + fx(pyRound(x / 100) * 100, 0);
  }

  // ---- literacy ----------------------------------------------------------
  function tierFromScore(s) { return s <= K.TIER_CUTS[0] ? "Low" : (s <= K.TIER_CUTS[1] ? "Medium" : "High"); }

  // ---- suitability profile, allocation, SIP ------------------------------
  const MAPS = {
    saving: { 1: 1.0, 3: 0.4, 2: 0.0 }, stability: { 2: 1.0, 1: 0.4 }, cashflow: { 3: 1.0, 2: 0.5, 1: 0.0 },
    dependents: { 1: 0.8, 2: 0.6, 3: 0.45, 4: 0.3, 5: 1.0, 6: 1.0 }
  };
  function profile(c, goalYears) {
    const age = K.AGE_MID[c.age_group];
    let horizon = age < 55 ? K.RETIREMENT_AGE - age : 5;
    if (goalYears != null) horizon = Number(goalYears);
    const comp = {
      horizon: Math.min(1, Math.max(0, horizon / 20)),
      emergency: c.emergency === 1 ? 1 : 0,
      saving: MAPS.saving[c.spend],
      debt: 1 - (c.debt_stress - 1) / 6,
      stability: MAPS.stability[c.income_drop],
      cashflow: MAPS.cashflow[c.difficulty],
      dependents: MAPS.dependents[c.dependents]
    };
    const T = (c.risk_w - 1) / 9;
    let C = 0;
    for (const k of Object.keys(K.CAPACITY_WEIGHTS)) C += comp[k] * K.CAPACITY_WEIGHTS[k];
    const S = 0.6 * Math.min(T, C) + 0.4 * (T + C) / 2;
    let cat = S < K.RISK_CUTS[0] ? "Conservative" : (S < K.RISK_CUTS[1] ? "Moderate" : "Aggressive");
    if (horizon <= 3) cat = "Conservative";
    else if (horizon < 5 && cat === "Aggressive") cat = "Moderate";
    return { tolerance: T, capacity: C, score: S, risk_cat: cat, horizon_years: horizon, binding: T <= C ? "tolerance" : "capacity", comp };
  }
  function sipRequired(fv, annualReturn, years, stepUp) {
    stepUp = stepUp || 0;
    const i = annualReturn / 12, Y = Math.max(1, pyRound(years));
    const a12 = Math.abs(i) < 1e-12 ? 12 : (Math.pow(1 + i, 12) - 1) / i * (1 + i);
    let factor = 0;
    for (let y = 0; y < Y; y++) factor += Math.pow(1 + stepUp, y) * a12 * Math.pow(1 + i, 12 * (Y - 1 - y));
    return fv / factor;
  }
  function plan(c, goalAmountToday, goalYears, incomeOverride) {
    const p = profile(c, goalYears), cat = p.risk_cat;
    const income = incomeOverride ? Number(incomeOverride) : K.INR_INCOME[c.income_b];
    const saveRate = { 1: 0.20, 3: 0.05, 2: 0.0 }[c.spend];
    const expenses = income * (1 - saveRate), surplus = income - expenses;
    const efTarget = 6 * expenses, efGap = c.emergency === 1 ? 0 : efTarget;
    const years = p.horizon_years;
    let corpusToday;
    if (goalAmountToday != null) corpusToday = Number(goalAmountToday);
    else if (K.AGE_MID[c.age_group] < 55) corpusToday = 25 * 12 * expenses;
    else corpusToday = 3 * 12 * expenses;
    const corpusFuture = corpusToday * Math.pow(1 + K.INFLATION, years);
    const r = K.ASSUMED_RETURN[cat];
    const sip = sipRequired(corpusFuture, r, years, K.STEP_UP);
    const affordable = surplus > 0 && sip <= surplus;
    const sipStart = affordable ? sip : Math.max(500, pyRound(0.8 * surplus / 100) * 100);
    const contrib = [];
    for (const k of Object.keys(K.CAPACITY_WEIGHTS)) contrib.push([k, K.CAPACITY_WEIGHTS[k] * (p.comp[k] - 0.5)]);
    contrib.push(["tolerance", 0.30 * (p.tolerance - 0.5)]);
    const up = contrib.slice().sort((a, b) => b[1] - a[1]).filter(e => e[1] > 0.01).slice(0, 2).map(e => e[0]);
    const down = contrib.slice().sort((a, b) => a[1] - b[1]).filter(e => e[1] < -0.01).slice(0, 2).map(e => e[0]);
    return {
      risk_cat: cat, score: p.score, tolerance: p.tolerance, capacity: p.capacity, binding: p.binding,
      allocation: Object.assign({}, K.MODEL_PORTFOLIOS[cat]), horizon_years: years, income, expenses, surplus,
      ef_target: efTarget, ef_gap: efGap, corpus_today: corpusToday, corpus_future: corpusFuture, assumed_return: r,
      sip, sip_affordable: affordable, sip_start: sipStart, drivers_up: up, drivers_down: down
    };
  }

  // ---- explanation engine ------------------------------------------------
  function explain(pl, register, evidence) {
    const ev = (evidence || DATA.evidence.evidence)[pl.risk_cat], a = pl.allocation, safe = a.Gilt + a.Liquid;
    const up = pl.drivers_up, down = pl.drivers_down, yrs = pyRound(pl.horizon_years);
    const pct0 = x => fx(x * 100, 0);
    let s = [];
    if (register === "Plain") {
      s = ["We suggest " + K.CAT_PLAIN[pl.risk_cat] + " for you.",
        "Out of every " + RUPEE + "100 you put in, " + RUPEE + a.Equity + " goes to shares of big Indian companies.",
        RUPEE + a.Gold + " goes to gold.", "The other " + RUPEE + safe + " goes to safer choices that move less.", "Why this mix?"];
      up.slice(0, 1).forEach(k => s.push(K.PLAIN_UP[k]));
      down.slice(0, 2).forEach(k => s.push(K.PLAIN_DOWN[k]));
      if (down.length) s.push("So we took a little less risk than we could have.");
      if (pl.ef_gap > 0) s.push("First, try to keep about " + inrWords(pl.ef_gap) + " aside for a rainy day.");
      if (pl.sip_affordable) s.push("Then put in about " + inrWords(pl.sip) + " each month. Raise it a little every year, for " + yrs + " years.");
      else {
        s.push("To reach your goal in " + yrs + " years you would need to start with about " + inrWords(pl.sip) + " each month.");
        s.push("That is more than you can spare now. Start with " + inrWords(pl.sip_start) + " each month and add more each year.");
      }
      s.push("Shares can fall in some years. In its worst spell, a plan like this fell about " + Math.abs(pyRound(ev.max_dd)) + " out of every 100 rupees.");
      const beat = ev.pct_beat_liquid == null ? 100 : ev.pct_beat_liquid;
      if (beat >= 99.5) s.push("Over ten years it did better than a savings-type fund in every past case we checked.");
      else if (beat >= 95) s.push("Over ten years it did better than a savings-type fund in almost every past case we checked.");
      else s.push("Over ten years it did better than a savings-type fund in about " + pyRound(beat / 10) + " out of 10 past cases.");
      s.push("The past is not a promise.");
      return s.join(" ");
    }
    if (register === "Guided") {
      s = ["Your risk profile is " + pl.risk_cat + ".",
        "We suggest putting " + a.Equity + "% in a Nifty 50 index fund (shares of India's 50 largest companies), " + a.Gold +
        "% in gold, " + a.Gilt + "% in a government bond fund and " + a.Liquid + "% in a liquid fund (similar to a savings account)."];
      const why = up.slice(0, 2).map(k => K.GUIDED[k][0]).concat(down.slice(0, 2).map(k => K.GUIDED[k][1]));
      if (why.length) s.push("This mix reflects " + why.join("; ") + ".");
      if (pl.ef_gap > 0) s.push("Before investing, build an emergency fund of about " + inr(pl.ef_gap) + ", which is six months of expenses.");
      s.push("To reach your goal in " + yrs + " years you would need a monthly SIP (a regular monthly investment) of about " + inr(pl.sip) +
        " in the first year, raised by " + pct0(K.STEP_UP) + "% each year. This assumes " + pct0(pl.assumed_return) + "% yearly growth and " +
        pct0(K.INFLATION) + "% inflation.");
      if (!pl.sip_affordable) s.push("This is above your current monthly surplus, so start with " + inr(pl.sip_start) + " and raise it faster as your income grows.");
      s.push("In past ten-year periods this mix returned about " + fx(ev.xirr_p50, 1) + "% a year in the middle case and " +
        fx(ev.xirr_p05, 1) + "% in a poor case. Its largest fall from a peak was " + fx(Math.abs(ev.max_dd), 0) + "%.");
      return s.join(" ");
    }
    s = ["Suitability score " + fx(pl.score, 2) + " (tolerance " + fx(pl.tolerance, 2) + ", capacity " + fx(pl.capacity, 2) +
      "; binding constraint: " + pl.binding + ") maps to the " + pl.risk_cat + " model portfolio.",
      "Strategic allocation: " + a.Equity + "% Nifty 50 index equity, " + a.Gold + "% gold ETF, " + a.Gilt + "% gilt, " + a.Liquid +
      "% liquid; annual rebalancing to target weights."];
    if (up.length || down.length) {
      const parts = [];

        if (o.labels) g += `<text class="v" x="${(x + bw / 2 - 1).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" style="font-size:10px">${f0(s.values[i])}</text>`;
      });
      g += `<text x="${(L + i * pw + pw / 2).toFixed(1)}" y="${H - B + 16}" text-anchor="middle">${esc(narrow() ? c.replace(" literacy", "") : c)}</text>`;
    });
    if (o.xTitle) g += `<text x="${(L + W - R) / 2}" y="${H - 2}" text-anchor="middle">${esc(o.xTitle)}</text>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "Bar chart")}">${g}</svg>` + legend(series);
  }
  function lines(labels, series, o) {
    o = o || {}; const W = CW(), H = narrow() ? 230 : 270, L = 42, R = 14, T = 12, B = 30, all = series.flatMap(s => s.values.filter(v => v != null));
    let lo = o.min != null ? o.min : Math.min.apply(null, all), hi = o.max != null ? o.max : Math.max.apply(null, all);
    const tr = v => o.log ? Math.log(v) : v; const a = tr(lo), b = tr(hi);
    const X = i => L + (W - L - R) * i / (labels.length - 1), Y = v => T + (H - T - B) * (1 - (tr(v) - a) / (b - a));
    let g = "";
    (o.ticks || niceTicks(lo, hi, 4)).forEach(t => { g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${o.fmt ? o.fmt(t) : f0(t)}</text>`; });
    labels.forEach((l, i) => { if (o.xShow ? o.xShow(l, i) && (!narrow() || Number(l.slice(0, 4)) % 8 === 0) : true) g += `<text x="${X(i)}" y="${H - B + 16}" text-anchor="middle">${esc(o.xFmt ? o.xFmt(l) : l)}</text>`; });
    if (o.markX != null) g += `<line class="axis" stroke-dasharray="4 3" x1="${X(o.markX)}" x2="${X(o.markX)}" y1="${T}" y2="${H - B}"/>`;
    if (o.ref != null) g += `<line class="axis" stroke-dasharray="4 3" x1="${L}" x2="${W - R}" y1="${Y(o.ref)}" y2="${Y(o.ref)}"/><text x="${W - R}" y="${Y(o.ref) - 5}" text-anchor="end">${esc(o.refLabel || "")}</text>`;
    series.forEach(s => {
      let d = "", started = false;
      s.values.forEach((v, i) => { if (v == null) return; d += (started ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); started = true; });
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
      if (o.dots) s.values.forEach((v, i) => { if (v != null) g += `<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.color}"><title>${esc(s.name)} at ${esc(labels[i])}: ${o.fmt ? o.fmt(v) : f1(v)}</title></circle>`; });
    });
    if (o.xTitle) g += `<text x="${(L + W - R) / 2}" y="${H - 1}" text-anchor="middle">${esc(o.xTitle)}</text>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "Line chart")}">${g}</svg>` + legend(series);
  }
  function dotci(rows, o) {
    const W = CW(), nw = narrow(), lw = nw ? 60 : 150, rt = nw ? 96 : 120, bh = 34, T = 8, B = 26, H = rows.length * bh + T + B, X = v => lw + (W - lw - rt) * (v - o.min) / (o.max - o.min);
    let g = "";
    niceTicks(o.min, o.max, 4).forEach(t => { g += `<line class="grid" x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${H - B}"/><text x="${X(t)}" y="${H - 8}" text-anchor="middle">${f0(t)}</text>`; });
    if (o.ref != null) g += `<line class="axis" stroke-dasharray="4 3" x1="${X(o.ref)}" x2="${X(o.ref)}" y1="${T}" y2="${H - B}"/>`;
    rows.forEach((r, i) => {
      const y = T + i * bh + bh / 2;
      g += `<text x="${lw - 10}" y="${y + 4}" text-anchor="end">${esc(nw ? r.label.replace(" literacy", "") : r.label)}</text>`;
      if (isFinite(r.mean)) {
        if (isFinite(r.lo)) g += `<line x1="${X(Math.max(o.min, r.lo))}" x2="${X(Math.min(o.max, r.hi))}" y1="${y}" y2="${y}" stroke="${r.color}" stroke-width="3"/>`;
        g += `<circle cx="${X(r.mean)}" cy="${y}" r="6" fill="${r.color}"/><text class="v" x="${W - rt + 8}" y="${y + 4}">${esc(r.text)}</text>`;
      } else g += `<text x="${lw + 6}" y="${y + 4}">no data yet</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "Interval chart")}">${g}</svg>`;
  }
  const legend = series => series.length < 2 ? "" : `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
  function table(head, rows, numFrom, hl) {

  function bindPrivacy() {

  function contrastAudit() {
    const cs = getComputedStyle(document.documentElement), tok = n => cs.getPropertyValue(n).trim();
    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    const lum = h => { h = h.replace("#", ""); return 0.2126 * lin(parseInt(h.slice(0, 2), 16)) + 0.7152 * lin(parseInt(h.slice(2, 4), 16)) + 0.0722 * lin(parseInt(h.slice(4, 6), 16)); };
    const ratio = (a, b) => { const x = lum(tok(a)), y = lum(tok(b)); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
    return [["Body text on page", "--ink", "--bg"], ["Body text on card", "--ink", "--surface"], ["Plan text on panel", "--ink", "--sunk"], ["Secondary text on card", "--muted", "--surface"],
      ["Secondary text on page", "--muted", "--bg"], ["Button label", "--accent-ink", "--accent"], ["Link on card", "--accent", "--surface"], ["Caution note", "--mark", "--mark-soft"],
      ["Success note", "--good", "--good-soft"], ["Alert note", "--crit", "--crit-soft"]].map(p => [p[0], ratio(p[1], p[2])]);
  }

        ${okComp ? `<p class="small muted">Literacy gap (High minus Low): ${f2(gapS)} with the standard display, ${f2(gapA)} with the adaptive one. Change: ${f2(gapS - gapA)} points.</p>` : ""}</div></section>
        <section class="grid g2"><div class="${cardCls}"><div class="row"><h2>Experience, trust and acceptance</h2>${stamp}</div>
        ${table(["Measure", "Low", "Medium", "High"], [["UEQ-S pragmatic quality (-3 to +3)", "prag"], ["UEQ-S hedonic quality (-3 to +3)", "hed"], ["Perceived usefulness (1 to 7)", "PU"], ["Trust (1 to 7)", "TRUST"], ["Privacy assurance (1 to 7)", "PRIV"], ["Explanation satisfaction (1 to 7)", "EXPL"], ["Intention to use (1 to 7)", "BI"]]
          .map(m => [m[0]].concat(K.TIERS.map(t => ms(byT(t).map(d => d[m[1]]), 2)))))}</div>
        <div class="${cardCls}"><div class="row"><h2>Privacy choice and scale reliability</h2>${stamp}</div>
        ${table(["Tier", "On-device only %", "Noised plan type %", "Full profile %"], K.TIERS.map(t => { const a = byT(t); return [t].concat(["device", "noisy", "full"].map(k => a.length ? f0(100 * a.filter(d => d.privacy === k).length / a.length) : "")); }))}
        ${table(["Scale", "Cronbach's alpha"], [["SUS (10 items)", alpha(Array.from({ length: 10 }, (x, i) => "sus_" + (i + 1)), true)], ["UEQ-S pragmatic", alpha(["ueq_1", "ueq_2", "ueq_3", "ueq_4"])], ["UEQ-S hedonic", alpha(["ueq_5", "ueq_6", "ueq_7", "ueq_8"])]]
          .concat(Object.keys(INS.CONSTRUCTS).map(k => [k, alpha(INS.CONSTRUCTS[k].map((t, i) => k + "_" + (i + 1)))])))}</div></section>`;
    }
    return `<section class="card"><h1>Researcher dashboard</h1>
      <div class="row"><span class="pill ${real ? "good" : "warn"}">${local.length} saved on this device</span><span class="pill info">${state.imported.length} imported</span>${hasSim ? `<span class="pill crit">${state.sim.length} simulated</span>` : ""}</div>
      ${!hasSim && real > 0 && K.TIERS.some(t => byT(t).length < 20) ? `<div class="note"><b>Pilot-sized sample.</b> With fewer than 20 participants in a tier, read these as descriptive checks of the procedure. The hypothesis tests need the planned sample.</div>` : ""}
      ${hasSim ? `<div class="note crit"><b>Simulated data is loaded.</b> These numbers are invented to show how the dashboard works. They are not findings and must not be reported.</div>` : ""}
      <div class="row"><label class="btn" for="imp">Import responses (CSV or JSON)</label><input type="file" id="imp" accept=".csv,.json,text/csv,application/json" multiple style="position:absolute;left:-9999px">
      <button id="exp">Export all as CSV</button><button id="cpy">Copy CSV</button>
      ${hasSim ? `<button id="simOff">Remove simulated data</button>` : `<button id="simOn">Load simulated demo data</button>`}<button id="clr">Clear responses on this device</button></div>
      <p class="small muted" id="rmsg">Export gives the file that <code>o4_user_study_analysis.py</code> reads for the full statistical analysis (mixed model, equivalence test, acceptance model). Simulated rows are never exported.</p>
      <textarea id="csvBox" rows="3" readonly style="display:none" aria-label="CSV text"></textarea></section>${body}`;
  }
  function bindResearcher() {
    if (!state.unlocked) { const tryIt = () => { if ($("#code").value === CONFIG.ADMIN_CODE) { state.unlocked = true; render(); } else $("#err").textContent = "That code is not right."; };
      $("#unlock").addEventListener("click", tryIt); $("#code").addEventListener("keydown", e => { if (e.key === "Enter") tryIt(); }); return; }
    const realCsv = () => toCsv(localResponses().concat(state.imported));
    $("#exp").addEventListener("click", () => saveFile("responses.csv", realCsv(), "text/csv", $("#rmsg")));
    $("#cpy").addEventListener("click", () => { const b = $("#csvBox"); b.style.display = "block"; b.value = realCsv(); copyText(b.value, $("#rmsg")); });
    const on = $("#simOn"), off = $("#simOff");
    if (on) on.addEventListener("click", () => { state.sim = simulate(180); render(); });
    if (off) off.addEventListener("click", () => { state.sim = []; render(); });
    $("#clr").addEventListener("click", e => { if (e.target.dataset.sure) { store.set("pfw_responses", []); render(); } else { e.target.dataset.sure = "1"; e.target.textContent = "Press again to delete them for good"; } });
    $("#imp").addEventListener("change", ev => { const files = Array.from(ev.target.files || []); let left = files.length; if (!left) return;
      files.forEach(f => { const rd = new FileReader(); rd.onload = () => { try { const t = String(rd.result); let recs = /^\s*[\[{]/.test(t) ? [].concat(JSON.parse(t)) : parseCsv(t);
        recs = recs.filter(r => r && r.participant_id && String(r.participant_id).indexOf("SIM") !== 0); const seen = new Set(localResponses().concat(state.imported).map(r => String(r.participant_id)));
        recs.forEach(r => { if (!seen.has(String(r.participant_id))) { state.imported.push(r); seen.add(String(r.participant_id)); } }); } catch (e) { /* skip unreadable file */ }
        if (--left === 0) render(); }; rd.readAsText(f); }); });
  }

  // ================================================================== router
  const ROUTES = [["home", "Overview", viewHome, null], ["plan", "My plan", viewPlan, bindPlan], ["privacy", "Privacy", viewPrivacy, bindPrivacy], ["patterns", "Patterns", viewPatterns, null],
    ["market", "Market evidence", viewMarket, bindMarket], ["evaluation", "Evaluation", viewEvaluation, null], ["study", "Take part", viewStudy, bindStudy], ["researcher", "Researcher", viewResearcher, bindResearcher]];
  function render() {
    const h = (location.hash || "#home").slice(1), route = ROUTES.find(r => r[0] === h) || ROUTES[0];
    $("#nav").innerHTML = ROUTES.map(r => `<a href="#${r[0]}" ${r === route ? 'aria-current="page"' : ""}>${r[1]}</a>`).join("");
    $("#view").innerHTML = route[2]();
    if (route[3]) route[3]();
  }
  document.addEventListener("click", ev => {
    const b = ev.target.closest("button[data-reg]");
    if (b) { const key = b.dataset.key, reg = b.dataset.reg;
      if (key === "plan") { state.register = reg; $("#planPanel").innerHTML = planPanel(); }
      else if (st) { if (st.reg[key] !== reg) st.sw[key] = (st.sw[key] || 0) + 1; st.reg[key] = reg; $("#blockPlan").innerHTML = key === "own" ? planHtml(st.plan, "Adaptive", reg, "own") : blockPlanHtml(Number(key.slice(1))); } }
    const p = ev.target.closest("button[data-pat]"); if (p) { state.patView = p.dataset.pat; render(); }
  });
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
  let wasNarrow = narrow();
  window.addEventListener("resize", () => { if (narrow() !== wasNarrow) { wasNarrow = narrow(); if (!st || st.step === "consent" || (location.hash || "").slice(1) !== "study") render(); } });
  restoreLive();
  $("#asof").textContent = asOfText();
  window.PFW = { E, state, render, toCsv, simulate, derive, market: M, refreshMarket };
  render();
  if (CONFIG.LIVE_MARKET_DATA === "auto") refreshMarket().then(() => { if ((location.hash || "#home").slice(1) !== "study") render(); });
})();
</script>
</body>
</html>
